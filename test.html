<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Firebase</title>
</head>
<body>
  <h1>Test Firebase Products</h1>
  <div id="results"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAlr21Y1a8NPqRImYi3fyyyg8KKHXvwFTU",
      authDomain: "w-com-view.firebaseapp.com",
      projectId: "w-com-view",
      storageBucket: "w-com-view.firebasestorage.app",
      messagingSenderId: "12567957379",
      appId: "1:12567957379:web:7890123456789abcdef012"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function test() {
      console.log("Testing...");
      const resultsDiv = document.getElementById("results");
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        console.log("Snapshot size:", querySnapshot.size);
        let html = `<p>Found ${querySnapshot.size} products</p>`;
        querySnapshot.docs.forEach(doc => {
          html += `<div style="border: 1px solid #ccc; padding: 10px; margin: 10px;">
            <h3>${doc.id}</h3>
            <pre>${JSON.stringify(doc.data(), null, 2)}</pre>
          </div>`;
        });
        resultsDiv.innerHTML = html;
      } catch (e) {
        console.error("Error:", e);
        resultsDiv.innerHTML = `<p style="color: red;">Error: ${e.message}</p>`;
      }
    }

    test();
  </script>
</body>
</html>
