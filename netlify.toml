# Netlify config for Next.js 15 (App Router)
# https://docs.netlify.com/frameworks/next-js/overview/
#
# Without this file Netlify often deploys an empty publish dir
# (or guesses wrongly) which produces "page not found" 404s on
# every route, including /.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Pin Node to a Next.js 15 / React 19-compatible LTS.
  NODE_VERSION = "20"
